{{- if not .Values.llaves.secretoExistente }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxy-cache.secretoLlaves" . }}
  labels:
    {{- include "proxy-cache.etiquetas" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.interceptor.habilitado }}
  interceptor: {{ required "Falta llaves.interceptor, la llave de componente del Interceptor" .Values.llaves.interceptor | quote }}
  {{- end }}
  {{- if .Values.cache.zonas }}
  cache: {{ required "Falta llaves.cache, la llave de componente de las cachés" .Values.llaves.cache | quote }}
  {{- end }}
{{- end }}
{{- if and .Values.cache.zonas (not .Values.cache.ca.secretoExistente) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxy-cache.secretoCa" . }}
  labels:
    {{- include "proxy-cache.etiquetas" . | nindent 4 }}
type: Opaque
data:
  rootCA.pem: {{ required "Falta cache.ca.cert: --set-file cache.ca.cert=.certs/rootCA.pem" .Values.cache.ca.cert | b64enc }}
  rootCA-key.pem: {{ required "Falta cache.ca.llave: --set-file cache.ca.llave=.certs/rootCA-key.pem" .Values.cache.ca.llave | b64enc }}
{{- end }}
