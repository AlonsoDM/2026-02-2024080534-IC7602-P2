suite: secretos
templates:
  - templates/secretos.yaml
values:
  - valores-prueba.yaml
tests:
  - it: guarda las llaves de componente y la CA en Secrets
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: stringData
          value: { interceptor: llave-interceptor, cache: llave-cache }
        documentIndex: 0
      - equal:
          path: data["rootCA.pem"]
          value: Q0VSVElGSUNBRE8=
        documentIndex: 1
      - equal:
          path: data["rootCA-key.pem"]
          value: TExBVkU=
        documentIndex: 1

  - it: falla si falta una llave
    set:
      llaves.cache: ""
    asserts:
      - failedTemplate:
          errorPattern: "Falta llaves.cache"

  - it: falla si falta la CA
    set:
      cache.ca.llave: ""
    asserts:
      - failedTemplate:
          errorPattern: "Falta cache.ca.llave"

  - it: con Secrets ya creados no crea los suyos
    set:
      llaves.secretoExistente: mis-llaves
      cache.ca.secretoExistente: mi-ca
    asserts:
      - hasDocuments:
          count: 0
